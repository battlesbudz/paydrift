[railway]
language = "python"
builder = "nixpacks"

[build]
builder = "nixpacks"
buildCommand = "echo 'Static frontend already synced in backend/static_frontend'"
startCommand = "cd backend && pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn python-jose passlib bcrypt python-multipart psycopg2-binary sqlalchemy pydantic-settings stripe python-dotenv && uvicorn main:app --host 0.0.0.0 --port 8000"

[nixpacks]
python_version = "3.11"